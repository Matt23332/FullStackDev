<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login & Register</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
</head>
<body>
    <div class="container">
        <div class="forms-container">
            <div class="login-registration">
                <form action="" class="login-form">
                    <h2 class="title">Login</h2>
                    <div class="input-field">
                        <i class='bx bx-user'></i>
                        <input type="email" placeholder="Email" />
                    </div>
                    <div class="input-field">
                        <i class='bx bx-lock'></i>
                        <input type="password" placeholder="Password" />
                    </div>
                    <input type="submit" value="Login" class="btn solid" />
                </form>
                <form action="" class="registration-form">
                    <h2 class="title">Register</h2>
                    <div class="input-field">
                        <i class='bx bx-user'></i>
                        <input type="text" placeholder="First Name" />
                    </div>
                    <div class="input-field">
                        <i class='bx bx-user'></i>
                        <input type="text" placeholder="Last Name" />
                    </div>
                    <div class="input-field">
                        <i class="bx bx-phone"></i>
                        <input type="tel" placeholder="Phone Number" />
                    </div>
                    <div class="input-field">
                        <i class='bx bx-envelope'></i>
                        <input type="email" placeholder="Email" />
                    </div>
                    <div class="input-field">
                        <i class='bx bx-lock'></i>
                        <input type="password" placeholder="Password" />
                    </div>
                    <div class="input-field">
                        <i class='bx bx-lock'></i>
                        <input type="password" placeholder="Confirm Password" />
                    </div>
                    <input type="submit" value="Register" class="btn solid" />
                </form>
            </div>
        </div>

        <div class="panels-container">
            <div class="panel left-panel">
                <div class="content">
                    <h3>New here?</h3>
                    <p>
                        Join us today! Enter your personal details and start your journey with us.
                    </p>
                    <button class="btn transparent" id="register-btn">
                        Register
                    </button>
                </div>
            </div>
            <div class="panel right-panel">
                <div class="content">
                    <h3>One of us?</h3>
                    <p>
                        If you already have an account, just login. We've missed you!
                    </p>
                    <button class="btn transparent" id="login-btn">
                        Login
                    </button>
                </div>
                <img src="../assets/image-2.jpg" class="image" alt="Login image" />
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
